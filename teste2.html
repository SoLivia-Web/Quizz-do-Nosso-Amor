{title:"Digital Privacy", topic:"Tecnologia · Sociedade", gloss:[["data minimization", "the main concept discussed in the text"], ["evidence", "information used to support a conclusion"], ["trade-off", "a balance between advantages and costs"], ["to assess", "to evaluate carefully"]], paras:["People share information with digital services whenever they search, navigate, shop, communicate or use a connected device. Some collection is necessary for a service to function, but much of it is retained because it may be useful later. Data can reveal routines even when a person never states them directly. A sequence of locations may identify a home and workplace; repeated purchases can suggest health conditions; and a group of seemingly harmless records can become sensitive when combined.","Privacy protection is not only a matter of hiding a name. Modern systems can link records through device identifiers, behavioral patterns and statistical similarities. Removing direct identifiers may reduce risk without eliminating it. This is why data minimization, the practice of collecting and keeping only what is needed, is often presented as a safer design principle. It limits the material available for misuse, theft or accidental exposure.","Users face a difficult trade-off because consent notices are long and services are convenient. Clicking an agreement does not always mean that a person understands future uses, sharing partners or retention periods. Strong security can protect stored information, but it cannot answer whether an organization should have collected it in the first place. Nor can individual caution solve problems created by opaque algorithms and unequal bargaining power.","Organizations can improve trust by explaining purposes in plain language, setting deletion schedules and offering meaningful choices. Engineers can process information locally, separate datasets and test systems for unexpected inferences. Regulators may require access, correction and accountability. These steps do not make privacy absolute, but they move responsibility away from users alone. A respectful digital service treats information as something entrusted to it, not as an unlimited resource.","The discussion of data minimization also shows why decisions should be based on more than a single headline or measurement. Evidence must be interpreted in relation to time, place, scale and the people who experience the consequences. A result that is useful in one setting may require adjustment in another, particularly when resources, institutions or risks are distributed unevenly. For this reason, specialists commonly combine quantitative indicators with observation, comparison and feedback from affected communities. This approach does not remove uncertainty, but it makes assumptions visible and allows policies to be revised as new information becomes available. In the case of Digital Privacy, practical progress therefore depends on coordination: researchers can improve the evidence, professionals can apply it carefully, and public institutions can create conditions for fair implementation. The most responsible solution is usually gradual, transparent and evaluated against outcomes rather than promises.","This perspective also encourages readers to distinguish a promising proposal from a demonstrated result. Careful follow-up, accessible reporting and periodic review can show whether an intervention is effective, affordable and fair.","Readers should compare claims with the stated evidence, ask who benefits, and note which limitations remain before accepting a conclusion as universal."], q:[

{title:"Renewable Energy Storage", topic:"Engenharia · Energia", gloss:[["grid storage", "the main concept discussed in the text"], ["evidence", "information used to support a conclusion"], ["trade-off", "a balance between advantages and costs"], ["to assess", "to evaluate carefully"]], paras:["Wind and solar power can generate electricity without burning fuel, yet their output varies with weather and time. Solar panels produce most energy during daylight, while demand may peak after sunset. Wind conditions can change within hours. A reliable electrical grid must balance supply and demand continuously, so adding renewable generation requires more than installing turbines and panels. It also requires transmission, forecasting, flexible demand and ways to store or shift energy.","Batteries are the most visible storage technology. They can respond rapidly when demand changes and are useful for smoothing short fluctuations. Pumped hydropower stores energy by moving water uphill and releasing it through turbines later. Thermal systems, compressed air and chemical fuels may serve other timescales. Each option has different costs, geographic requirements, efficiencies and environmental impacts. No technology is automatically best for every region.","Storage is not a magic container that preserves electricity without losses. Charging and discharging waste some energy, and equipment requires materials, land and maintenance. A battery project may reduce the need for a new power plant, but it can also create recycling and mining challenges. Analysts therefore compare a storage system with alternatives such as stronger interconnections, energy efficiency or consumers shifting activities to periods of abundant generation.","Planning is becoming more sophisticated as costs and technologies change. A diverse portfolio can combine short-duration batteries with long-duration reservoirs and demand-response programs. Clear market rules can reward systems for reliability rather than merely for producing electricity. The transition will not depend on a single invention. It will depend on matching many tools to local conditions while reducing emissions and maintaining affordable service.","The discussion of grid storage also shows why decisions should be based on more than a single headline or measurement. Evidence must be interpreted in relation to time, place, scale and the people who experience the consequences. A result that is useful in one setting may require adjustment in another, particularly when resources, institutions or risks are distributed unevenly. For this reason, specialists commonly combine quantitative indicators with observation, comparison and feedback from affected communities. This approach does not remove uncertainty, but it makes assumptions visible and allows policies to be revised as new information becomes available. In the case of Renewable Energy Storage, practical progress therefore depends on coordination: researchers can improve the evidence, professionals can apply it carefully, and public institutions can create conditions for fair implementation. The most responsible solution is usually gradual, transparent and evaluated against outcomes rather than promises.","This perspective also encourages readers to distinguish a promising proposal from a demonstrated result. Careful follow-up, accessible reporting and periodic review can show whether an intervention is effective, affordable and fair.","Readers should compare claims with the stated evidence, ask who benefits, and note which limitations remain before accepting a conclusion as universal."], q:[

{title:"Vaccination and Community Protection", topic:"Saúde pública · Imunologia", gloss:[["herd immunity", "the main concept discussed in the text"], ["evidence", "information used to support a conclusion"], ["trade-off", "a balance between advantages and costs"], ["to assess", "to evaluate carefully"]], paras:["Vaccination protects individuals by preparing the immune system to recognize a pathogen before a dangerous encounter occurs. It also changes the pattern of transmission in a community. When many people are immune, an infected person has fewer susceptible contacts, so chains of infection are more likely to end. This indirect protection is often called herd immunity. It is not a fixed wall: the proportion needed depends on how contagious the pathogen is and how evenly protection is distributed.","Community protection matters because some people cannot be vaccinated or do not respond strongly to a vaccine. Infants may be too young, and patients receiving certain treatments may have weakened immune systems. A high level of immunity among neighbors lowers their chance of meeting the pathogen. However, the effect can disappear in pockets where coverage is low, even if a national average appears reassuring. Local gaps therefore deserve attention.","Public debate often focuses on individual risk while overlooking the risk of disease itself. Vaccines can cause temporary side effects, and rare serious reactions require monitoring and transparent investigation. Yet infection can produce complications, long-term disability or death at much higher rates. Trust grows when health professionals acknowledge uncertainty, explain benefits and maintain systems for reporting adverse events rather than dismissing concerns.","Successful programs depend on access as much as on persuasion. Clinics must be available at convenient times, records need to be accurate and messages should be adapted to different languages and communities. Schools, employers and primary-care teams can help identify missed doses without turning vaccination into a punishment. The goal is not perfect behavior from every person; it is a resilient network in which protection is broad, informed and fairly distributed.","The discussion of herd immunity also shows why decisions should be based on more than a single headline or measurement. Evidence must be interpreted in relation to time, place, scale and the people who experience the consequences. A result that is useful in one setting may require adjustment in another, particularly when resources, institutions or risks are distributed unevenly. For this reason, specialists commonly combine quantitative indicators with observation, comparison and feedback from affected communities. This approach does not remove uncertainty, but it makes assumptions visible and allows policies to be revised as new information becomes available. In the case of Vaccination and Community Protection, practical progress therefore depends on coordination: researchers can improve the evidence, professionals can apply it carefully, and public institutions can create conditions for fair implementation. The most responsible solution is usually gradual, transparent and evaluated against outcomes rather than promises.","This perspective also encourages readers to distinguish a promising proposal from a demonstrated result. Careful follow-up, accessible reporting and periodic review can show whether an intervention is effective, affordable and fair.","Readers should compare claims with the stated evidence, ask who benefits, and note which limitations remain before accepting a conclusion as universal."], q:[

{title:"Machine Translation", topic:"Linguística · Tecnologia", gloss:[["machine translation", "the main concept discussed in the text"], ["evidence", "information used to support a conclusion"], ["trade-off", "a balance between advantages and costs"], ["to assess", "to evaluate carefully"]], paras:["Machine translation has moved from word-for-word substitution toward systems that learn patterns from very large collections of text. A modern model may produce a fluent sentence without storing a direct equivalent for each word. It estimates which sequence is likely in a context, drawing on examples from many languages and domains. Fluency, however, is not the same as accuracy. A sentence can sound natural while quietly changing a date, negating a claim or inventing a relationship that the source never expressed.","Performance depends on the language pair, the subject and the available training material. Widely used languages often have more examples and specialized terminology than minority languages. Legal, medical and technical documents pose extra difficulty because a small error can have serious consequences. Names, numbers, idioms and ambiguous pronouns also challenge systems. Human translators use world knowledge and purpose; a model may rely on a frequent but inappropriate pattern.","Evaluation is therefore more complicated than asking whether readers like an output. Researchers compare translations with references, ask bilingual experts to identify errors and measure whether a system preserves meaning under changes in style. Automatic scores can be useful for broad comparisons, but they may reward literal wording or miss culturally important failures. A high score should be treated as evidence, not as a guarantee.","The most practical approach is often collaboration. Software can draft routine passages, suggest alternatives and accelerate searches for terminology. A qualified human can verify facts, adapt tone and take responsibility for the final version. Users should know when a translation was generated automatically, especially in settings involving health, law or public safety. The technology is valuable when its convenience is balanced by review, context and clear accountability.","The discussion of machine translation also shows why decisions should be based on more than a single headline or measurement. Evidence must be interpreted in relation to time, place, scale and the people who experience the consequences. A result that is useful in one setting may require adjustment in another, particularly when resources, institutions or risks are distributed unevenly. For this reason, specialists commonly combine quantitative indicators with observation, comparison and feedback from affected communities. This approach does not remove uncertainty, but it makes assumptions visible and allows policies to be revised as new information becomes available. In the case of Machine Translation, practical progress therefore depends on coordination: researchers can improve the evidence, professionals can apply it carefully, and public institutions can create conditions for fair implementation. The most responsible solution is usually gradual, transparent and evaluated against outcomes rather than promises.","This perspective also encourages readers to distinguish a promising proposal from a demonstrated result. Careful follow-up, accessible reporting and periodic review can show whether an intervention is effective, affordable and fair.","Readers should compare claims with the stated evidence, ask who benefits, and note which limitations remain before accepting a conclusion as universal."], q:[

{title:"Soil Carbon", topic:"Agronomia · Mudanças climáticas", gloss:[["soil carbon", "the main concept discussed in the text"], ["evidence", "information used to support a conclusion"], ["trade-off", "a balance between advantages and costs"], ["to assess", "to evaluate carefully"]], paras:["Soil is more than a medium that holds plant roots. It contains minerals, air, water, living organisms and organic matter derived from plants and animals. Some of that organic matter decomposes quickly, while other fractions can remain for years or centuries. When carbon enters soil faster than it leaves, the soil may become a temporary carbon sink. The amount stored depends on climate, texture, vegetation, moisture and management, so a field cannot be assigned a universal value.","Agricultural practices influence these flows. Cover crops keep living roots in the ground between harvests and can reduce erosion. Returning residues adds material, while reduced tillage may protect aggregates that shelter organic matter. Compost can improve structure and fertility, although transporting and applying it has costs. None of these practices guarantees a permanent increase: drought, fire, flooding or a change in land use can release stored carbon again.","Measurements are difficult because soil varies over short distances and through different depths. A sample taken near a fence may not represent an entire farm. Researchers combine field cores, remote sensing and models, but each method has uncertainty. Claims about climate benefits must therefore state the baseline, the time period and whether the carbon is additional. Counting a change that would have happened anyway can exaggerate the result.","Soil programs can still provide valuable benefits beyond climate accounting. Better structure may improve water retention, reduce erosion and support organisms that cycle nutrients. Farmers are more likely to adopt practices when they fit local economics and do not threaten food production. Policymakers should reward verified outcomes while avoiding promises of permanent storage where monitoring is weak. Soil carbon is useful, but it is not a substitute for cutting fossil-fuel emissions.","The discussion of soil carbon also shows why decisions should be based on more than a single headline or measurement. Evidence must be interpreted in relation to time, place, scale and the people who experience the consequences. A result that is useful in one setting may require adjustment in another, particularly when resources, institutions or risks are distributed unevenly. For this reason, specialists commonly combine quantitative indicators with observation, comparison and feedback from affected communities. This approach does not remove uncertainty, but it makes assumptions visible and allows policies to be revised as new information becomes available. In the case of Soil Carbon, practical progress therefore depends on coordination: researchers can improve the evidence, professionals can apply it carefully, and public institutions can create conditions for fair implementation. The most responsible solution is usually gradual, transparent and evaluated against outcomes rather than promises.","This perspective also encourages readers to distinguish a promising proposal from a demonstrated result. Careful follow-up, accessible reporting and periodic review can show whether an intervention is effective, affordable and fair.","Readers should compare claims with the stated evidence, ask who benefits, and note which limitations remain before accepting a conclusion as universal."], q:[

{title:"Migration and Cities", topic:"Geografia · Políticas públicas", gloss:[["urban migration", "the main concept discussed in the text"], ["evidence", "information used to support a conclusion"], ["trade-off", "a balance between advantages and costs"], ["to assess", "to evaluate carefully"]], paras:["People move to cities for many reasons, including employment, education, safety, family ties and access to services. Migration is rarely a single decision made under ideal conditions. Drought, conflict or a sudden loss of income may narrow the alternatives, while a relative already in the city can make arrival possible. New residents often contribute skills, labor and entrepreneurship, but they may initially live in informal housing or work without legal protection.","Urban growth can create pressure on transport, water, schools and health systems. These pressures are not produced by migrants alone; they also reflect planning choices, housing costs and unequal investment across neighborhoods. When authorities ignore new settlements, residents may lack addresses, drainage and secure tenure. Yet informal communities frequently develop their own businesses and social networks. Treating them only as a problem can overlook resources that a city could build upon.","Research on migration shows mixed economic effects. New workers may fill shortages and create demand for goods, while competition can be difficult for people already facing precarious employment. Outcomes depend on skills, discrimination, labor rules and the speed with which public services expand. Headlines often present a national average, but experiences differ sharply between districts and generations. Children who attend stable schools may have opportunities that their parents did not.","Effective policy combines planning with participation. Affordable housing near jobs can reduce long commutes, while portable documents help people access care and education. Municipalities can work with community organizations instead of designing services without local knowledge. Migration will continue to shape cities, whether governments welcome it or not. Preparing for that reality is usually less costly than reacting after exclusion has produced preventable hardship.","The discussion of urban migration also shows why decisions should be based on more than a single headline or measurement. Evidence must be interpreted in relation to time, place, scale and the people who experience the consequences. A result that is useful in one setting may require adjustment in another, particularly when resources, institutions or risks are distributed unevenly. For this reason, specialists commonly combine quantitative indicators with observation, comparison and feedback from affected communities. This approach does not remove uncertainty, but it makes assumptions visible and allows policies to be revised as new information becomes available. In the case of Migration and Cities, practical progress therefore depends on coordination: researchers can improve the evidence, professionals can apply it carefully, and public institutions can create conditions for fair implementation. The most responsible solution is usually gradual, transparent and evaluated against outcomes rather than promises.","This perspective also encourages readers to distinguish a promising proposal from a demonstrated result. Careful follow-up, accessible reporting and periodic review can show whether an intervention is effective, affordable and fair.","Readers should compare claims with the stated evidence, ask who benefits, and note which limitations remain before accepting a conclusion as universal."], q:[

{title:"Forest Fragmentation", topic:"Ecologia · Conservação", gloss:[["habitat fragmentation", "the main concept discussed in the text"], ["evidence", "information used to support a conclusion"], ["trade-off", "a balance between advantages and costs"], ["to assess", "to evaluate carefully"]], paras:["A forest can disappear in more than one way. Clearing an entire area removes habitat directly, but roads, farms and settlements can also divide a continuous forest into isolated fragments. The remaining patches may still look green from above, yet their ecological conditions can change sharply near the new edges. More light, wind and human access can dry the vegetation and make fires easier to spread. The interior habitat that many species require becomes smaller even when the total area has not changed.","Fragmentation affects animals differently. A generalist bird may cross a road and use several patches, while a small mammal or plant may be unable to move between them. Isolated populations have fewer opportunities to exchange genes, increasing the risk of inbreeding and local extinction. Predators, parasites and invasive species may also become more common near edges. Because these processes unfold over years, a forest can appear stable until a threshold is reached.","Ecologists study fragmentation with field surveys, acoustic sensors, genetic samples and satellite images. Corridors connecting patches can help some species move, but a corridor is not automatically safe. Its width, vegetation, ownership and exposure to traffic all matter. Underpasses, restored riverbanks and protected stepping-stones may provide alternatives where a continuous corridor is impossible. Monitoring is needed to learn whether animals actually use the route.","Conservation planning therefore looks beyond individual reserves. Protecting large blocks remains important, but so do land-use rules, local livelihoods and cooperation across property boundaries. Indigenous and local communities often hold knowledge about seasonal movement and fire. A successful strategy reduces new clearing, improves the quality of existing fragments and preserves connections. The objective is not simply to draw green shapes on a map; it is to maintain ecological processes over time.","The discussion of habitat fragmentation also shows why decisions should be based on more than a single headline or measurement. Evidence must be interpreted in relation to time, place, scale and the people who experience the consequences. A result that is useful in one setting may require adjustment in another, particularly when resources, institutions or risks are distributed unevenly. For this reason, specialists commonly combine quantitative indicators with observation, comparison and feedback from affected communities. This approach does not remove uncertainty, but it makes assumptions visible and allows policies to be revised as new information becomes available. In the case of Forest Fragmentation, practical progress therefore depends on coordination: researchers can improve the evidence, professionals can apply it carefully, and public institutions can create conditions for fair implementation. The most responsible solution is usually gradual, transparent and evaluated against outcomes rather than promises.","This perspective also encourages readers to distinguish a promising proposal from a demonstrated result. Careful follow-up, accessible reporting and periodic review can show whether an intervention is effective, affordable and fair.","Readers should compare claims with the stated evidence, ask who benefits, and note which limitations remain before accepting a conclusion as universal."], q:[

{title:"Behavioral Economics", topic:"Economia · Decisão", gloss:[["default option", "the main concept discussed in the text"], ["evidence", "information used to support a conclusion"], ["trade-off", "a balance between advantages and costs"], ["to assess", "to evaluate carefully"]], paras:["Traditional economic models often describe people as careful decision-makers who compare every cost and benefit. In everyday life, attention, time and information are limited. Behavioral economics studies how these limits shape choices. One important idea is the default: the option that takes effect when a person does nothing. Because changing a default requires effort, people frequently remain with it, even when another option might suit them better. The effect is powerful but not universal.","Retirement savings provide a common example. When employees must actively enroll, participation may be low; automatic enrollment can raise it because saving becomes the path of least resistance. A default can also be harmful if it is obscure, expensive or difficult to leave. Researchers therefore distinguish between helping people act on their own goals and manipulating them toward an institution’s goals. Transparency and easy opt-out procedures are central to that distinction.","Other findings concern framing, social information and present bias. People may respond differently to the same medical statistic depending on whether it describes survival or mortality. A message about what neighbors do can encourage conservation, but it can also normalize waste if the comparison is unfavorable. Present bias makes immediate rewards feel more important than distant benefits, which helps explain difficulties with exercise, saving and preventive care.","Public agencies and companies use these insights in many ways, from reminders to simpler forms. Good design can reduce unnecessary friction without removing freedom of choice. Evaluation is essential because an intervention that works in one setting may confuse people in another. Policymakers should measure distributional effects, not just average behavior. The larger lesson is modest: context influences decisions, so institutions should design contexts responsibly rather than assume that information alone will change conduct.","The discussion of default option also shows why decisions should be based on more than a single headline or measurement. Evidence must be interpreted in relation to time, place, scale and the people who experience the consequences. A result that is useful in one setting may require adjustment in another, particularly when resources, institutions or risks are distributed unevenly. For this reason, specialists commonly combine quantitative indicators with observation, comparison and feedback from affected communities. This approach does not remove uncertainty, but it makes assumptions visible and allows policies to be revised as new information becomes available. In the case of Behavioral Economics, practical progress therefore depends on coordination: researchers can improve the evidence, professionals can apply it carefully, and public institutions can create conditions for fair implementation. The most responsible solution is usually gradual, transparent and evaluated against outcomes rather than promises.","This perspective also encourages readers to distinguish a promising proposal from a demonstrated result. Careful follow-up, accessible reporting and periodic review can show whether an intervention is effective, affordable and fair.","Readers should compare claims with the stated evidence, ask who benefits, and note which limitations remain before accepting a conclusion as universal."], q:[

{title:"Remote Sensing", topic:"Geotecnologia · Ciência de dados", gloss:[["remote sensing", "the main concept discussed in the text"], ["evidence", "information used to support a conclusion"], ["trade-off", "a balance between advantages and costs"], ["to assess", "to evaluate carefully"]], paras:["Remote sensing gathers information about Earth without placing a measuring instrument at every location. Satellites, aircraft and drones record reflected or emitted energy at different wavelengths. Visible images resemble photographs, while infrared data can reveal vegetation stress, surface temperature or moisture patterns that the human eye cannot see. The sensor does not directly announce what is happening on the ground; researchers interpret signals using physical knowledge, calibration and comparisons with field observations.","The scale of observation is one of the technology’s strengths. A satellite can revisit a large region and show how a shoreline, crop or glacier changes over time. Yet resolution involves trade-offs. A fine spatial resolution may cover a smaller area, while frequent observations may use coarser pixels. Clouds can block optical sensors, and similar surfaces may produce similar signals. An image is therefore not a neutral mirror but a measurement with limits.","Analysis increasingly uses machine learning to classify land cover and detect unusual patterns. Training data must represent the places and seasons where a model will be used. If a system learns from clear images in one region, it may fail when smoke, shadows or different farming practices appear elsewhere. Analysts validate results with samples, uncertainty estimates and independent data. A colorful map can look precise even when its underlying classification is uncertain.","Remote sensing supports agriculture, disaster response, conservation and urban planning. It can identify flooded roads, estimate crop stress and document illegal clearing more quickly than field teams alone. Ethical questions remain about surveillance, ownership of images and the consequences of an incorrect map. The best practice combines remote observations with local expertise, open methods and humility about what pixels can and cannot tell us.","The discussion of remote sensing also shows why decisions should be based on more than a single headline or measurement. Evidence must be interpreted in relation to time, place, scale and the people who experience the consequences. A result that is useful in one setting may require adjustment in another, particularly when resources, institutions or risks are distributed unevenly. For this reason, specialists commonly combine quantitative indicators with observation, comparison and feedback from affected communities. This approach does not remove uncertainty, but it makes assumptions visible and allows policies to be revised as new information becomes available. In the case of Remote Sensing, practical progress therefore depends on coordination: researchers can improve the evidence, professionals can apply it carefully, and public institutions can create conditions for fair implementation. The most responsible solution is usually gradual, transparent and evaluated against outcomes rather than promises.","This perspective also encourages readers to distinguish a promising proposal from a demonstrated result. Careful follow-up, accessible reporting and periodic review can show whether an intervention is effective, affordable and fair.","Readers should compare claims with the stated evidence, ask who benefits, and note which limitations remain before accepting a conclusion as universal."], q:[

{title:"Circular Economy", topic:"Indústria · Sustentabilidade", gloss:[["circular economy", "the main concept discussed in the text"], ["evidence", "information used to support a conclusion"], ["trade-off", "a balance between advantages and costs"], ["to assess", "to evaluate carefully"]], paras:["Most industrial systems follow a linear pattern: materials are extracted, transformed into products, used and discarded. A circular economy tries to reduce this waste by keeping materials and products useful for longer. Reuse, repair, refurbishment, remanufacture and recycling are related strategies, but they are not identical. Repair preserves more of a product, while recycling usually breaks it into material. The order matters because processing can require energy and can reduce quality.","Design determines whether circular strategies are possible. A device with glued components, proprietary screws or unavailable spare parts may be difficult to repair. Products made from mixed materials can also be expensive to separate. Designers can improve durability, modularity and access to parts, but they must balance these features with safety, cost and performance. A longer-lasting product is not automatically better if it consumes far more energy during use.","Business models may change as well. Leasing, deposit systems and take-back programs can give manufacturers an incentive to maintain products and recover materials. However, collection does not guarantee circularity: returned goods may be exported, stored or downcycled. Consumers need clear information about quality, warranties and prices. Workers in informal recycling economies also deserve attention because they often perform essential recovery work without protection.","Circularity is therefore a system goal rather than a label attached to one object. Governments can set durability standards, support repair rights and use procurement to create demand for recycled material. Companies can track flows and publish results, while consumers can prefer durable goods when alternatives are affordable. Even then, reducing unnecessary consumption remains important. A circular system can slow resource use, but it cannot make unlimited growth consequence-free.","The discussion of circular economy also shows why decisions should be based on more than a single headline or measurement. Evidence must be interpreted in relation to time, place, scale and the people who experience the consequences. A result that is useful in one setting may require adjustment in another, particularly when resources, institutions or risks are distributed unevenly. For this reason, specialists commonly combine quantitative indicators with observation, comparison and feedback from affected communities. This approach does not remove uncertainty, but it makes assumptions visible and allows policies to be revised as new information becomes available. In the case of Circular Economy, practical progress therefore depends on coordination: researchers can improve the evidence, professionals can apply it carefully, and public institutions can create conditions for fair implementation. The most responsible solution is usually gradual, transparent and evaluated against outcomes rather than promises.","This perspective also encourages readers to distinguish a promising proposal from a demonstrated result. Careful follow-up, accessible reporting and periodic review can show whether an intervention is effective, affordable and fair.","Readers should compare claims with the stated evidence, ask who benefits, and note which limitations remain before accepting a conclusion as universal."], q:[

{title:"Food Waste", topic:"Nutrição · Políticas públicas", gloss:[["food waste", "the main concept discussed in the text"], ["evidence", "information used to support a conclusion"], ["trade-off", "a balance between advantages and costs"], ["to assess", "to evaluate carefully"]], paras:["Food is lost or wasted at many points between a field and a household. Crops may be left unharvested because of weather, labor shortages or cosmetic standards. During storage and transport, pests, heat and poor packaging can damage products. Shops may remove food before its quality has seriously declined, while households may buy more than they can use. These stages differ by region, so a single solution cannot address every source.","The environmental cost is larger than the weight of discarded food suggests. Land, water, fertilizer, energy and labor were used to produce it. When organic waste decomposes without enough oxygen, it can release methane, a powerful greenhouse gas. Waste also raises questions of equity: some households struggle to afford nutritious food while edible products are discarded elsewhere. Redistribution can help, but safety rules, transport and timing determine whether it is practical.","Labels often create confusion. A date indicating quality is not the same as a date indicating safety, yet consumers may treat both as a strict deadline. Clear wording and education can reduce unnecessary disposal without encouraging people to consume spoiled food. Better inventory systems help retailers match supply with demand. Farmers may sell irregular produce when buyers accept variation, although markets still need to compensate the work of harvesting and handling it.","Prevention usually has greater value than disposal. Planning meals, improving cold chains and designing smaller portions can avoid waste before it appears. Surplus that remains safe may be donated or processed, and unavoidable scraps can be composted or used to produce energy. Policymakers should measure where losses occur and support the people who can change those points. The objective is not perfection but a food system that uses resources more carefully and distributes benefits more fairly.","The discussion of food waste also shows why decisions should be based on more than a single headline or measurement. Evidence must be interpreted in relation to time, place, scale and the people who experience the consequences. A result that is useful in one setting may require adjustment in another, particularly when resources, institutions or risks are distributed unevenly. For this reason, specialists commonly combine quantitative indicators with observation, comparison and feedback from affected communities. This approach does not remove uncertainty, but it makes assumptions visible and allows policies to be revised as new information becomes available. In the case of Food Waste, practical progress therefore depends on coordination: researchers can improve the evidence, professionals can apply it carefully, and public institutions can create conditions for fair implementation. The most responsible solution is usually gradual, transparent and evaluated against outcomes rather than promises.","This perspective also encourages readers to distinguish a promising proposal from a demonstrated result. Careful follow-up, accessible reporting and periodic review can show whether an intervention is effective, affordable and fair.","Readers should compare claims with the stated evidence, ask who benefits, and note which limitations remain before accepting a conclusion as universal."], q:[

{title:"Citizen Science", topic:"Ciência · Participação social", gloss:[["citizen science", "the main concept discussed in the text"], ["evidence", "information used to support a conclusion"], ["trade-off", "a balance between advantages and costs"], ["to assess", "to evaluate carefully"]], paras:["Citizen science involves members of the public in scientific activities such as observing birds, measuring air quality, recording rainfall or classifying images. Participants may collect data, help design questions or discuss results with researchers. The approach can expand geographic and temporal coverage beyond what a small professional team could achieve. It can also make science more visible in daily life. Participation, however, does not automatically make a project representative or accurate.","Data quality depends on the task and the support provided. Volunteers may receive training, use standardized instructions and submit photographs for verification. Digital platforms can flag unusual entries, while statistical models can estimate uncertainty. Even so, experienced observers may contribute more records than beginners, and internet access can shape who participates. Researchers must describe these biases rather than present a large dataset as if it were a random sample.","The educational benefits can be substantial. People learn to distinguish observation from interpretation and may become more attentive to changes in their neighborhoods. A project can also reveal concerns that formal monitoring overlooked, such as odors, noise or flooding at particular times. Trust is stronger when participants know how their contributions will be used and when results are returned to the community in an understandable form.","Good citizen science is a partnership, not free labor disguised as outreach. Researchers should share goals, protect personal information and acknowledge contributions. Communities should have ways to question methods and ask new questions. Professional expertise remains necessary for sampling design and analysis, while local knowledge can improve relevance. When both forms of knowledge are respected, public participation can produce useful evidence and a more inclusive scientific culture.","The discussion of citizen science also shows why decisions should be based on more than a single headline or measurement. Evidence must be interpreted in relation to time, place, scale and the people who experience the consequences. A result that is useful in one setting may require adjustment in another, particularly when resources, institutions or risks are distributed unevenly. For this reason, specialists commonly combine quantitative indicators with observation, comparison and feedback from affected communities. This approach does not remove uncertainty, but it makes assumptions visible and allows policies to be revised as new information becomes available. In the case of Citizen Science, practical progress therefore depends on coordination: researchers can improve the evidence, professionals can apply it carefully, and public institutions can create conditions for fair implementation. The most responsible solution is usually gradual, transparent and evaluated against outcomes rather than promises.","This perspective also encourages readers to distinguish a promising proposal from a demonstrated result. Careful follow-up, accessible reporting and periodic review can show whether an intervention is effective, affordable and fair.","Readers should compare claims with the stated evidence, ask who benefits, and note which limitations remain before accepting a conclusion as universal."], q:[

{title:"Water Reuse", topic:"Engenharia · Recursos hídricos", gloss:[["water reuse", "the main concept discussed in the text"], ["evidence", "information used to support a conclusion"], ["trade-off", "a balance between advantages and costs"], ["to assess", "to evaluate carefully"]], paras:["Cities traditionally treat used water as waste, clean it to a legal standard and discharge it into a river or the sea. Water reuse changes this relationship by treating some wastewater as a resource. Reclaimed water may irrigate parks, support industry, recharge aquifers or, after advanced treatment, supplement drinking supplies. The appropriate use depends on the quality of the source, the treatment process, local regulations and public confidence. Reuse is not a single technology or a guarantee of safety.","Treatment can involve biological processes, filtration, membranes, disinfection and careful monitoring. Each barrier removes different contaminants, and operators must understand how they interact. Pharmaceuticals, salts and industrial chemicals may require specialized attention. A system also needs alarms, trained staff and plans for failure. Testing the final water is important, but continuous process control is equally necessary because a sample cannot describe every moment.","Public acceptance is often the greatest challenge. People may react strongly to the idea of drinking water that was once sewage, even when the treatment is rigorous. Transparent communication should explain the water cycle without dismissing discomfort. Demonstrations, independent oversight and clear labeling can help. Trust can disappear if an agency hides an incident or makes promises that exceed what the monitoring can support.","Reuse can reduce pressure on rivers and reservoirs, especially during drought, but it consumes energy and does not eliminate the need to protect watersheds. Pricing, infrastructure and access determine who benefits. A wealthy district may install advanced systems while poorer communities face unreliable supply. Planning should therefore combine reuse with conservation, leakage control and equitable investment. The goal is a safer and more resilient water system, not simply a new source of volume.","The discussion of water reuse also shows why decisions should be based on more than a single headline or measurement. Evidence must be interpreted in relation to time, place, scale and the people who experience the consequences. A result that is useful in one setting may require adjustment in another, particularly when resources, institutions or risks are distributed unevenly. For this reason, specialists commonly combine quantitative indicators with observation, comparison and feedback from affected communities. This approach does not remove uncertainty, but it makes assumptions visible and allows policies to be revised as new information becomes available. In the case of Water Reuse, practical progress therefore depends on coordination: researchers can improve the evidence, professionals can apply it carefully, and public institutions can create conditions for fair implementation. The most responsible solution is usually gradual, transparent and evaluated against outcomes rather than promises.","This perspective also encourages readers to distinguish a promising proposal from a demonstrated result. Careful follow-up, accessible reporting and periodic review can show whether an intervention is effective, affordable and fair.","Readers should compare claims with the stated evidence, ask who benefits, and note which limitations remain before accepting a conclusion as universal."], q:[

{title:"Cognitive Load", topic:"Educação · Psicologia", gloss:[["cognitive load", "the main concept discussed in the text"], ["evidence", "information used to support a conclusion"], ["trade-off", "a balance between advantages and costs"], ["to assess", "to evaluate carefully"]], paras:["Working memory can hold only a limited amount of new information at one time. Cognitive load theory distinguishes between the difficulty inherent in a subject, the effort caused by confusing presentation and the mental activity that helps build useful knowledge. A learner cannot remove every difficulty: fractions, grammar and anatomy have structures that must be understood. Instruction can, however, avoid adding unnecessary obstacles that consume attention without supporting learning.","A page crowded with decorative images, duplicated explanations and distant labels may force students to search rather than reason. This extra effort is sometimes called extraneous load. Clear headings, worked examples and carefully sequenced practice can leave more capacity for the essential relationships. Yet simplicity must not become vagueness. Removing a diagram that shows a mechanism may make the concept harder, even if the page looks cleaner.","Expertise changes what counts as difficult. A beginner may need labels and step-by-step guidance, while an advanced student may find the same support repetitive. Prior knowledge allows experts to group details into meaningful patterns. Good teaching therefore adapts explanations and gradually reduces scaffolding. A single design cannot serve every learner equally, and apparent speed during a lesson is not proof of durable understanding.","Teachers can manage load by introducing one relationship at a time, connecting new ideas to known examples and requiring students to retrieve information later. Short assessments reveal misconceptions before they become habits. Digital tools can help when they make structure visible, but animation and interactivity are   id:i+1, title:t.title, topic:t.topic, gloss:t.gloss, paras:t.paras,
  q:t.q.map((r,k)=>({t:r[0],p:r[1],m:r[2],w:r[3],correct:r[4],wrong:r[5],e:r[6],pts:TYPES[r[0]].pts,n:k+1}))
}));
const MAX = ORDER.reduce((s,t)=>s+TYPES[t].pts,0); // 50

/* ============ UTIL ============ */
const app = document.getElementById("app");
const tbRight = document.getElementById("tbRight");
function lsGet(k){try{return localStorage.getItem("teap_"+k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem("teap_"+k,v)}catch(e){}}
let lang = lsGet("lang")||"pt";
let S = null, timer = null;
const L = i=>"ABCDE"[i];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmt(sec){const m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
function best(id){const v=lsGet("best_"+id);return v===null?null:+v}

const STEM={
  info:{pt:"Qual afirmação é verdadeira, de acordo com o texto?",en:"Which statement is true, according to the text?"},
  para:{pt:"Qual afirmação é verdadeira, de acordo com este trecho do texto?",en:"Which statement is true, according to this part of the text?"},
  sent:{pt:"Escolha a alternativa com sentido mais próximo da sentença destacada.",en:"Choose the alternative that is closest in meaning to the highlighted sentence."},
  main:{pt:"Qual é a ideia central do texto?",en:"What is the main idea of the text?"},
  vocab:{pt:w=>`A palavra “${w}”, destacada no texto, tem sentido mais próximo de qual alternativa?`,en:w=>`The word “${w}”, highlighted in the text, is closest in meaning to which of the alternatives?`},
  pron:{pt:w=>`O pronome “${w}”, destacado no texto, refere-se a qual alternativa?`,en:w=>`The pronoun “${w}”, highlighted in the text, refers to which of the alternatives?`}
};
function stem(q){const s=STEM[q.t][lang];return typeof s==="function"?s(q.w):s}

function excerpt(q,test){
  if(q.p==null) return "";
  const txt=test.paras[q.p];
  if(q.t==="para") return `<blockquote class="ex"><span class="pn">${q.p+1}</span><span>${txt}</span></blockquote>`;
  const i=txt.indexOf(q.m);
  if(i<0) return "";
  const mid = q.t==="sent" ? `<mark>${q.m}</mark>` : q.m.replace(q.w,`<mark>${q.w}</mark>`);
  return `<blockquote class="ex"><span class="pn">${q.p+1}</span><span>${txt.slice(0,i)}${mid}${txt.slice(i+q.m.length)}</span></blockquote>`;
}

/* ============ TELAS ============ */
function setTop(extra){tbRight.innerHTML=extra||""}

function langSeg(){
  return `<div class="seg" role="group" aria-label="Idioma dos enunciados">
    <button data-lang="pt" class="${lang==="pt"?"on":""}">Enunciados em PT</button>
    <button data-lang="en" class="${lang==="en"?"on":""}">Statements in EN</button></div>`;
}

function renderHome(){
  clearInterval(timer); S=null; setTop("");
  const rows=ORDER.reduce((a,t)=>{a[t]=(a[t]||0)+1;return a},{});
  const tbl=Object.keys(TYPES).map(k=>`<tr><td>${TYPES[k].name}</td><td>${rows[k]} ${rows[k]>1?"questões":"questão"} × ${TYPES[k].pts}</td><td>${rows[k]*TYPES[k].pts} pts</td></tr>`).join("");
  const cards=TESTS.map(t=>{
    const b=best(t.id);
    return `<button class="tcard" data-open="${t.id}">
      <span class="n">Simulado ${String(t.id).padStart(2,"0")}</span>
      <span class="t">${t.title}</span>
      <span class="d">${t.topic}</span>
      <span class="badge ${b!==null?"done":""}">${b!==null?`Melhor nota: ${b}/${MAX}`:`10 questões · ${MAX} pontos`}</span>
    </button>`}).join("");
  app.innerHTML=`
  <section class="hero">
    <h1>Simulados TEAP</h1>
    <p>${TESTS.length} simulados de leitura acadêmica em inglês, cada um com 10 questões e 50 pontos. Treine referência pronominal, vocabulário e interpretação no estilo da prova, com gabarito comentado.</p>
  </section>

  <section class="card tips" aria-labelledby="tipsH">
    <h2 id="tipsH">⚠️ Dicas Estratégicas para o TEAP</h2>
    <ul>
      <li><b>Atenção aos pronomes</b> (<code>it</code>, <code>they</code>, <code>their</code>, <code>which</code>): não escolha só a palavra vizinha. Pergunte <i>quem pratica a ação</i> ou <i>quem é o dono do objeto/ideia</i>, e confira se singular/plural combinam. Às vezes o <code>which</code> retoma a frase inteira.</li>
      <li><b>Falsos cognatos e vocabulário</b>: <code>impose</code> não é "impor" no sentido de impressionar, <code>preserve</code> não é "prevenir", <code>admit</code> nem sempre é "admitir". Fique de olho em verbos frasais como <code>outperform</code> (superar) e <code>stem from</code> (derivar de). Sempre releia a frase com a palavra substituída.</li>
      <li><b>Ideia central</b> (vale 7 pontos, o maior peso): ela abrange o texto inteiro. Desconfie de alternativas absolutas (<code>always</code>, <code>only</code>, <code>all</code>, <code>never</code>) e das que falam só de um parágrafo ou detalhe.</li>
      <li><b>Sentenças e parágrafos</b>: a alternativa certa é uma paráfrase. Mantenha a lógica de conectivos como <code>rather than</code>, <code>unless</code>, <code>whereas</code>, <code>nevertheless</code>.</li>
      <li><b>Gestão de tempo</b>: sem dicionário, procure o sentido pelo contexto e não trave em palavras desconhecidas.</li>
    </ul>
  </section>

  <section class="card">
    <h2>Pontuação de cada simulado</h2>
    <table class="pts"><thead><tr><th>Tipo de questão</th><th>Quantidade</th><th>Pontos</th></tr></thead>
    <tbody>${tbl}</tbody>
    <tfoot><tr><td>Total</td><td>10 questões</td><td>${MAX} pts</td></tr></tfoot></table>
  </section>

  <div class="row" style="margin-bottom:14px"><h2 style="margin:0">Escolha um simulado</h2>${langSeg()}</div>
  <section class="grid">${cards}</section>`;
}

function startTest(id){
  const test=TESTS.find(t=>t.id===id); if(!test){location.hash="#/";return}
  clearInterval(timer);
  S={test, answers:Array(10).fill(null),
     submitted:false, started:false, t0:null,
     opts:test.q.map(q=>shuffle([{txt:q.correct,ok:true},...q.wrong.map(w=>({txt:w,ok:false}))]))};
  renderTest();
  window.scrollTo(0,0);
}

/* ---- helpers do início/relógio ---- */
function elapsed(){ return S && S.t0 ? Math.floor((Date.now()-S.t0)/1000) : 0 }

function startClock(){
  clearInterval(timer);
  if(!S || !S.started || S.submitted) return;
  timer=setInterval(()=>{
    const t=fmt(elapsed());
    const a=document.getElementById("timer");    if(a) a.textContent=t;
    const b=document.getElementById("bigTimer");  if(b) b.textContent=t;
  },500);
}

function drawStartCard(){
  const el=document.getElementById("startCard"); if(!el) return;
  if(S.submitted){ el.style.display="none"; return; }
  if(!S.started){
    el.innerHTML=`
      <h2>⏱ Pronto para começar?</h2>
      <p>O cronômetro começa quando você clicar em <b>Iniciar</b>. Você pode ler o texto com calma antes — as questões ficam bloqueadas até começar. O tempo total aparecerá no resultado final.</p>
      <button class="btn big" id="startBtn" type="button">▶ Iniciar simulado</button>`;
  } else {
    el.innerHTML=`
      <div class="run-banner">
        <span class="run-dot"></span>
        <span class="lbl">Simulado em andamento</span>
        <span class="big-timer" id="bigTimer">${fmt(elapsed())}</span>
      </div>`;
  }
}

function beginTest(){
  if(!S || S.started || S.submitted) return;
  const y=window.scrollY;
  S.started=true; S.t0=Date.now();
  drawStartCard(); drawQuestions(); updateSubmitBar(); startClock();
  window.scrollTo(0,y);
}

function updateSubmitBar(){
  const bar=document.getElementById("submitBar");
  const btn=document.getElementById("submit");
  if(!bar||!btn) return;
  if(S.submitted){ bar.style.display="none"; return; }
  bar.style.display="";
  if(!S.started){ btn.disabled=true;  btn.textContent="Inicie o simulado para responder"; }
  else          { btn.disabled=false; btn.textContent="Enviar / Corrigir Prova"; }
}

function renderTest(){
  const t=S.test;
  const gl=t.gloss.map(g=>`<li><b>${g[0]}:</b> ${g[1]}</li>`).join("");
  const paras=t.paras.map((p,i)=>`<p><span class="pn">${i+1}</span><span>${p}</span></p>`).join("");
  const timerTxt = S.submitted ? fmt(elapsed()) : (S.started ? fmt(elapsed()) : "⏸");
  setTop(`<span class="pill hide-m">Simulado ${String(t.id).padStart(2,"0")}</span><span class="pill" id="cnt"></span><span class="pill" id="timer">${timerTxt}</span>`);
  app.innerHTML=`
  <button class="back" data-home>← Todos os simulados</button>
  <div class="row" style="margin-bottom:12px"><h1 style="margin:0;font-size:1.5rem">Simulado ${String(t.id).padStart(2,"0")} · ${t.title}</h1>${langSeg()}</div>
  <div id="result"></div>
  <section class="card startCard" id="startCard"></section>
  <section class="card textcard">
    <h2>TEXT</h2>
    <div class="reading">${paras}</div>
    <div class="gloss"><b>Glossary</b><ul>${gl}</ul></div>
  </section>
  <section id="qs"></section>
  <div class="sticky-submit" id="submitBar"><button class="btn big" id="submit" type="button">Enviar / Corrigir Prova</button></div>`;
  drawStartCard(); drawQuestions(); updateCount(); updateSubmitBar(); startClock();
}

function drawQuestions(){
  const t=S.test, rv=S.submitted, locked=!S.started;
  const note = locked && !rv ? `<div class="pre-note">▶ Clique em <b>Iniciar simulado</b> acima para liberar as questões. Você já pode ler o texto.</div>` : "";
  document.getElementById("qs").innerHTML = note + t.q.map((q,i)=>{
    const opts=S.opts[i].map((o,j)=>{
      const chosen=S.answers[i]===j;
      let cls="opt";
      if(locked) cls+=" locked";
      if(rv){ if(o.ok)cls+=" ok"; else if(chosen)cls+=" bad"; }
      else if(chosen) cls+=" sel";
      const dis = rv || locked;
      const tag = rv ? (o.ok?`<span class="tag">✔ Gabarito${chosen?" · sua resposta":""}</span>`:(chosen?`<span class="tag">✘ Sua resposta</span>`:"")) : "";
      return `<label class="${cls}"><input type="radio" name="q${i}" value="${j}" ${chosen?"checked":""} ${dis?"disabled":""}><span class="lt">${L(j)}</span><span>${o.txt}</span>${tag}</label>`;
    }).join("");
    let expl="";
    if(rv){
      const okAns = S.answers[i]!==null && S.opts[i][S.answers[i]].ok;
      const li=S.opts[i].findIndex(o=>o.ok);
      expl=`<div class="expl ${okAns?"good":"miss"}"><b>${okAns?"✔ Correto!":(S.answers[i]===null?"Em branco.":"✘ Não foi dessa vez.")} Resposta: ${L(li)}</b>${q.e}</div>`;
    }
    return `<article class="q ${rv?"rv":""}" id="q${i}">
      <div class="q-head"><span class="q-num">Questão ${i+1}</span><span class="q-meta">${TYPES[q.t].name} · ${q.pts} pts</span></div>
      <div class="stem">${stem(q)}</div>
      ${excerpt(q,t)}
      <div class="opts">${opts}</div>${expl}</article>`;
  }).join("");
}

function updateCount(){
  const n=S.answers.filter(a=>a!==null).length;
  const el=document.getElementById("cnt"); if(el) el.textContent=`${n}/10 respondidas`;
}

function submit(){
  if(!S || !S.started || S.submitted) return;
  const blank=S.answers.filter(a=>a===null).length;
  if(blank && !confirm(`Você deixou ${blank} questão(ões) em branco. Corrigir mesmo assim?`)) return;
  S.submitted=true; clearInterval(timer);
  drawStartCard();
  const secs=Math.floor((Date.now()-S.t0)/1000);
  const per={}; let score=0, hits=0;
  S.test.q.forEach((q,i)=>{
    const ok=S.answers[i]!==null && S.opts[i][S.answers[i]].ok;
    per[q.t]=per[q.t]||{got:0,max:0,n:0,hit:0};
    per[q.t].max+=q.pts; per[q.t].n++;
    if(ok){score+=q.pts;hits++;per[q.t].got+=q.pts;per[q.t].hit++}
  });
  const pct=Math.round(score/MAX*100);
  const prev=best(S.test.id);
  if(prev===null||score>prev) lsSet("best_"+S.test.id,String(score));
  const msg = pct>=80?"Excelente! Você domina bem o estilo da prova."
            : pct>=60?"Bom desempenho. Revise os tipos em que perdeu pontos."
            : pct>=40?"Você está no caminho. Estude os comentários e refaça."
            : "Releia as dicas no topo e estude o gabarito comentado com calma.";
  const keys=Object.keys(TYPES);
  const bars=keys.map(k=>{
    const p=per[k]; const r=p.got/p.max;
    return `<div class="bar ${r<.5?"low":r<.8?"mid":""}"><div class="lbl"><span>${TYPES[k].name}</span><span>${p.got}/${p.max} pts · ${p.hit}/${p.n} ${p.n>1?"acertos":"acerto"}</span></div><div class="tr"><div class="fl" style="width:${Math.round(r*100)}%"></div></div></div>`;
  }).join("");
  const weak=keys.map(k=>({k,r:per[k].got/per[k].max})).sort((a,b)=>a.r-b.r)[0];
  const advice = weak.r<1 ? `<p><b>Ponto de atenção: ${TYPES[weak.k].name}.</b> ${TYPES[weak.k].tip}</p>` : `<p><b>Gabarito perfeito!</b> Tente outro simulado para manter o ritmo.</p>`;
  const next=S.test.id<TESTS.length?S.test.id+1:null;
  document.getElementById("result").innerHTML=`
  <section class="card result" id="resCard">
    <h2>Resultado</h2>
    <div class="score">
      <div class="ring" style="--p:${pct}"><div><b>${score}</b><span>de ${MAX} pts</span></div></div>
      <div><div style="font-size:1.6rem;font-weight:700;color:var(--blue-900)">${pct}% de acerto</div>
      <div>${hits} de 10 questões corretas · tempo: ${fmt(secs)}</div>
      <p style="margin:.4em 0 0">${msg}</p>
      <p class="note" style="margin:.3em 0 0">${prev!==null&&score<=prev?`Sua melhor nota neste simulado: ${prev}/${MAX}.`:"Nova melhor nota neste simulado!"} A nota mínima real depende do edital do seu programa.</p></div>
    </div>
    <div class="bars">${bars}</div>
    <div style="margin-top:14px">${advice}</div>
    <div class="row" style="margin-top:12px;justify-content:flex-start">
      <button class="btn" data-open="${S.test.id}">Refazer este simulado</button>
      ${next?`<button class="btn ghost" data-open="${next}">Próximo simulado →</button>`:""}
      <button class="btn ghost" data-home>Todos os simulados</button>
    </div>
    <p class="note" style="margin-bottom:0">Role a página para ver o gabarito comentado de cada questão.</p>
  </section>`;
  document.getElementById("submitBar").style.display="none";
  drawQuestions(); updateCount();
  document.getElementById("cnt").textContent=`${score}/${MAX} pts`;
  document.getElementById("resCard").scrollIntoView({behavior:"smooth",block:"start"});
}

/* ============ EVENTOS ============ */
document.addEventListener("click",e=>{
  const open=e.target.closest("[data-open]");
  if(open){ const id=+open.dataset.open; if(location.hash==="#/t"+id) startTest(id); else location.hash="#/t"+id; return; }
  if(e.target.id==="startBtn"){ beginTest(); return; }
  if(e.target.closest("[data-home]")||e.target.closest("#brand")){
    if(S&&!S.submitted&&S.answers.some(a=>a!==null)&&!confirm("Sair do simulado? Suas respostas serão perdidas.")) return;
    location.hash="#/"; if(!S) renderHome(); return;
  }
  const lg=e.target.closest("[data-lang]");
  if(lg){ lang=lg.dataset.lang; lsSet("lang",lang); if(S){ const y=window.scrollY; renderTestKeepState(); window.scrollTo(0,y);} else renderHome(); return; }
  if(e.target.id==="submit") submit();
});
document.getElementById("brand").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();e.target.click()}});
function renderTestKeepState(){
  const resHTML=document.getElementById("result")?document.getElementById("result").innerHTML:"";
  const sub=S.submitted;
  const scrollY=window.scrollY;
  renderTest();
  document.getElementById("result").innerHTML=resHTML;
  if(sub){document.getElementById("submitBar").style.display="none"}
  window.scrollTo(0,scrollY);
}
document.addEventListener("change",e=>{
  if(e.target.matches('.opt input[type=radio]') && S && S.started && !S.submitted){
    const i=+e.target.name.slice(1), j=+e.target.value;
    S.answers[i]=j;
    document.querySelectorAll(`#q${i} .opt`).forEach((l,k)=>l.classList.toggle("sel",k===j));
    updateCount();
  }
});

function route(){
  const m=location.hash.match(/^#\/t(\d+)$/);
  if(m) startTest(+m[1]); else renderHome();
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
